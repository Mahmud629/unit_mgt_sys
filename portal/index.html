<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>5 SIG BN — Unit Systems</title>
<meta name="description" content="5 Signal Battalion — Unit Systems Portal." />
<link rel="icon" href="assets/crest-160.png" />
<script>
  // theme and language before first paint (no flash)
  (function () {
    try {
      var t = localStorage.getItem("portal-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      document.documentElement.lang = localStorage.getItem("ums-lang") === "bn" ? "bn" : "en";
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  })();
</script>
<script src="config.js"></script>
<style>
  /* fonts are bundled — the portal works without internet */
  @font-face { font-family: "Jakarta"; font-weight: 200 800; font-display: swap; src: url(assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Jakarta"; font-weight: 200 800; font-display: swap; src: url(assets/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0100-02BA, U+1E00-1EFF; }
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; font-display: swap; src: url(assets/fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; font-display: swap; src: url(assets/fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0100-02BA, U+1E00-1EFF; }
  @font-face { font-family: "Hind Siliguri"; font-weight: 400; font-display: swap; src: url(assets/fonts/hind-siliguri-bengali-400-normal.woff2) format("woff2"); unicode-range: U+0980-09FE, U+200C-200D, U+25CC; }
  @font-face { font-family: "Hind Siliguri"; font-weight: 600; font-display: swap; src: url(assets/fonts/hind-siliguri-bengali-600-normal.woff2) format("woff2"); unicode-range: U+0980-09FE, U+200C-200D, U+25CC; }
  @font-face { font-family: "Hind Siliguri"; font-weight: 700; font-display: swap; src: url(assets/fonts/hind-siliguri-bengali-700-normal.woff2) format("woff2"); unicode-range: U+0980-09FE, U+200C-200D, U+25CC; }

  :root {
    --navy: #0d2233; --navy-2: #132f45; --green: #4f6f52; --gold: #c9a646;
    --bg: #eef2f5; --panel: #ffffff; --text: #18222d; --text-2: #3a4a57; --muted: #6b7a86; --line: #dfe6ea;
    --shadow: 0 1px 2px #0d22330d, 0 8px 24px #0d223312; --shadow-hover: 0 2px 4px #0d22330f, 0 18px 40px #0d223326;
    --ok: #2e8b57; --down: #c0392b; --wait: #b9852f;
    --font: "Inter Variable", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Jakarta", "Hind Siliguri", "Inter Variable", system-ui, sans-serif;
    --card-w: clamp(280px, 25vw, 440px); --card-h: calc(var(--card-w) * .64); --gap: 18px;
  }
  :root[data-theme="dark"] {
    --bg: #0b141b; --panel: #13202a; --text: #e6edf2; --text-2: #c2ced7; --muted: #8b9aa6; --line: #24343f;
    --shadow: 0 1px 2px #00000040, 0 8px 24px #00000052; --shadow-hover: 0 2px 4px #00000040, 0 18px 40px #00000080;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html[lang="bn"] body { --font: "Hind Siliguri", "Inter Variable", system-ui, sans-serif; }
  body { font-family: var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }

  /* ---------------------------------------------------------------- hero */
  .hero { position: relative; overflow: hidden; color: #fff; padding: 0 0 38px;
    background:
      radial-gradient(900px 380px at 50% 0%, #2a5675 0%, transparent 70%),
      repeating-linear-gradient(135deg, #ffffff06 0 2px, transparent 2px 14px),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%); }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--green), var(--gold), var(--green)); opacity: .9; }
  .watermark { position: absolute; right: -80px; top: 30px; width: 380px; opacity: .05; pointer-events: none; filter: grayscale(1); }
  .topbar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 18px 32px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; letter-spacing: 1.6px; font-size: 14px; }
  .brand img { width: 32px; height: 32px; object-fit: contain; }
  .spacer { flex: 1; }
  .clock { text-align: right; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .clock strong { display: block; font-size: 17px; letter-spacing: .5px; }
  .clock span { font-size: 11.5px; color: #b8c8d4; }
  .seg { display: inline-flex; border: 1px solid #ffffff33; border-radius: 10px; overflow: hidden; }
  .seg button { background: transparent; color: #d7e2ea; border: 0; padding: 7px 11px; font-size: 12.5px; font-weight: 700; }
  .seg button.on { background: #ffffff; color: var(--navy); }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #ffffff33; background: transparent; color: #fff; display: grid; place-items: center; }
  .icon-btn:hover, .seg button:not(.on):hover { background: #ffffff1a; }
  .head { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 4px 24px 0; }
  .head-text { text-align: left; }
  .sub { margin: 8px 0 0; color: #c3d2dd; font-size: 17px; font-weight: 600; }
  .crest { width: 168px; height: 168px; object-fit: contain; filter: drop-shadow(0 10px 24px #00000066); animation: rise .6s ease both; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  html[lang="bn"] .eyebrow { letter-spacing: .3px; font-size: 13.5px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 5vw, 60px); letter-spacing: -1px; line-height: 1.05; }

  /* -------------------------------------------------- activities ribbon */
  .ribbon { position: relative; z-index: 3; margin-top: 28px; height: var(--card-h); overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .ribbon[hidden] { display: none; }
  .track { display: flex; gap: var(--gap); width: max-content; padding: 0 var(--gap); animation: slide var(--dur, 40s) linear infinite; }
  .ribbon:hover .track, .ribbon:focus-within .track, .ribbon.still .track { animation-play-state: paused; }
  .ribbon.static .track { animation: none; margin: 0 auto; }
  @keyframes slide { to { transform: translateX(calc(-1 * var(--shift, 0px))); } }
  .shot { position: relative; flex: none; width: var(--card-w); height: var(--card-h); border-radius: 18px; overflow: hidden; border: 0; padding: 0; background: #1c3d57; box-shadow: 0 12px 30px #0d223333; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .shot:hover img, .shot:focus-visible img { transform: scale(1.05); }
  .shot:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 13px; text-align: left; color: #fff; background: linear-gradient(180deg, transparent, #000000b3); }
  .cap strong { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap span { font-size: 11.5px; color: #e3e9ee; opacity: .9; }

  /* --------------------------------------------------------------- tiles */
  main { position: relative; z-index: 3; width: 100%; max-width: 1140px; margin: 30px auto 0; padding: 0 24px 30px; flex: 1; }
  .section-label { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font-size: 11.5px; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  html[lang="bn"] .section-label { letter-spacing: .3px; font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .tile { --c: #2f6f9f; position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 18px; min-height: 96px; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease, border-color .18s; animation: rise .45s ease both; }
  .tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); opacity: .85; }
  .tile::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); pointer-events: none; }
  .tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); outline: none; }
  .tile:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 40%, transparent), var(--shadow-hover); }
  .ico { flex: none; width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000)); box-shadow: 0 8px 18px color-mix(in srgb, var(--c) 32%, transparent); }
  .ico svg { width: 27px; height: 27px; }
  .ico.logo { background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 16px #0d22331f; }
  .ico.logo img { width: 42px; height: 42px; object-fit: contain; }
  .txt { flex: 1; min-width: 0; }
  .txt strong { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: -.1px; line-height: 1.25; }
  .txt small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .meta { position: absolute; top: 11px; right: 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; color: var(--muted); }
  .meta i { width: 7px; height: 7px; border-radius: 50%; background: var(--wait); }
  .meta.ok i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .meta.down i { background: var(--down); }
  .meta.down::after { content: attr(data-off); color: var(--down); letter-spacing: .2px; font-weight: 700; }
  .meta.wait i { animation: blink 1s ease-in-out infinite; }
  .meta.wait::after { content: attr(data-wait); color: var(--wait); letter-spacing: .2px; font-weight: 700; }
  @keyframes blink { 50% { opacity: .25; } }
  .go { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); transition: transform .18s ease, background .18s, color .18s; margin-top: 12px; }
  .tile:hover .go { transform: translateX(3px); background: var(--c); color: #fff; }
  .last { position: absolute; bottom: 9px; right: 16px; font-size: 10.5px; font-weight: 700; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 24px 26px; }
  footer .sep { margin: 0 8px; opacity: .5; }

  /* ------------------------------------------------------------- lightbox */
  .lb { position: fixed; inset: 0; z-index: 50; background: #050b10e6; display: grid; place-items: center; padding: 24px; }
  .lb[hidden] { display: none; }
  .lb figure { margin: 0; max-width: min(1100px, 100%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lb img { max-width: 100%; max-height: calc(100vh - 140px); border-radius: 12px; box-shadow: 0 20px 60px #000a; }
  .lb figcaption { color: #fff; text-align: center; }
  .lb figcaption strong { display: block; font-size: 17px; }
  .lb figcaption span { color: #b8c8d4; font-size: 13px; }
  .lb .icon-btn { position: absolute; background: #ffffff14; }
  .lb .close { top: 18px; right: 18px; }
  .lb .prev { left: 18px; top: 50%; }
  .lb .next { right: 18px; top: 50%; }

  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .ribbon { overflow-x: auto; }
  }
  @media (max-width: 980px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .watermark { display: none; } }
  @media (max-width: 600px) {
    :root { --card-w: 78vw; --card-h: calc(78vw * .64); --gap: 10px; }
    .topbar { padding: 12px 16px; gap: 8px; }
    .clock { display: none; }
    .topbar { justify-content: center; padding: 14px 16px 0; }
    .head { flex-direction: column; gap: 10px; text-align: center; }
    .crest { width: 104px; height: 104px; }
    .ribbon { margin-top: 18px; }
    .head-text { text-align: center; }
    .sub { font-size: 14px; }
    main { padding: 0 16px 28px; margin-top: 22px; }
    .tiles { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .tile { min-height: 80px; padding: 14px; gap: 13px; }
    .ico { width: 48px; height: 48px; border-radius: 13px; }
    .txt strong { font-size: 16px; }
  }
</style>
</head>
<body>
  <header class="hero">
    <img class="watermark" src="assets/crest.webp" alt="" />
    <div class="topbar">
      <div class="clock" aria-live="off"><strong id="time">--:--:--</strong><span id="date"></span></div>
      <div class="seg" role="group" aria-label="Language"><button id="lang-en" type="button">EN</button><button id="lang-bn" type="button">বাংলা</button></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Dark / light mode"></button>
    </div>
    <div class="head">
      <img class="crest" src="assets/crest.webp" alt="5 Signal Battalion crest" />
      <div class="head-text">
        <p class="eyebrow" data-t="eyebrow">Unit Systems Portal</p>
        <h1 id="unitName">5 Signal Battalion</h1>
        <p class="sub" id="unitAlt"></p>
      </div>
    </div>
  </header>

  <section class="ribbon" id="ribbon" hidden><div class="track" id="track"></div></section>

  <main><h2 class="section-label" data-t="modules">Modules</h2><nav class="tiles" id="tiles" aria-label="Systems"></nav></main>

  <footer><span data-t="official">For official use only</span><span class="sep">·</span><span>© BA 11108 Capt Asif Mahmud, Sigs</span></footer>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true">
    <button class="icon-btn close" id="lb-close" type="button" aria-label="Close">✕</button>
    <button class="icon-btn prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
    <figure><img id="lb-img" alt="" /><figcaption><strong id="lb-title"></strong><span id="lb-date"></span></figcaption></figure>
    <button class="icon-btn next" id="lb-next" type="button" aria-label="Next">›</button>
  </div>

<script>
(function () {
  var C = window.PORTAL_CONFIG || { unit: {}, systems: [] };
  var host = location.hostname || "localhost";
  var T = {
    en: { eyebrow: "Unit Systems Portal", official: "For official use only", online: "Online", offline: "Offline", updating: "Updating…", last: "Last used", activities: "Daily activities", modules: "Modules" },
    bn: { eyebrow: "ইউনিট সিস্টেম পোর্টাল", official: "শুধু দাপ্তরিক ব্যবহারের জন্য", online: "চালু আছে", offline: "বন্ধ", updating: "হালনাগাদ হচ্ছে…", last: "সর্বশেষ ব্যবহৃত", activities: "দৈনিক কার্যক্রম", modules: "মডিউল" },
  };
  var lang = document.documentElement.lang === "bn" ? "bn" : "en";
  var BN_DIGITS = "০১২৩৪৫৬৭৮৯";
  var digits = function (s) { return lang === "bn" ? String(s).replace(/[0-9]/g, function (d) { return BN_DIGITS[d]; }) : String(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var base = function (s) { return String(s.url || "").replace("{host}", host); };
  var fmtDate = function (d) {
    if (!d) return "";
    try { return new Intl.DateTimeFormat(lang === "bn" ? "bn-BD" : "en-GB", { day: "numeric", month: "short", year: "numeric" }).format(new Date(d + "T12:00:00")); } catch (e) { return d; }
  };

  // ------------------------------------------------------------------- icons
  var P = {
    database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    clipboard: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    briefcase: '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
    calendar: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4M8 2v4M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    boxes: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12M16.5 9.4 7.5 4.2"/>',
  };
  var svg = function (k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (P[k] || P.database) + "</svg>"; };
  var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  // tiles: every system's tiles in one grid
  var tiles = [];
  C.systems.forEach(function (s) { (s.tiles || [{ id: s.id, name: s.name, name_bn: s.name_bn, logo: s.logo, color: s.color, path: "" }]).forEach(function (t) { tiles.push({ t: t, s: s }); }); });

  // ------------------------------------------------------------------- render
  var last = null;
  try { last = localStorage.getItem("portal-last"); } catch (e) {}
  function render() {
    var t = T[lang];
    document.title = (C.unit.short || "5 SIG BN") + " — " + (lang === "bn" ? "ইউনিট সিস্টেম" : "Unit Systems");
    document.getElementById("unitName").textContent = lang === "bn" ? (C.unit.name_bn || C.unit.name) : C.unit.name;
    document.getElementById("unitAlt").textContent = lang === "bn" ? C.unit.name || "" : C.unit.name_bn || "";
    [].forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.textContent = t[el.getAttribute("data-t")] || ""; });
    document.getElementById("lang-en").className = lang === "en" ? "on" : "";
    document.getElementById("lang-bn").className = lang === "bn" ? "on" : "";
    document.getElementById("ribbon").setAttribute("aria-label", t.activities);
    document.getElementById("tiles").innerHTML = tiles.map(function (x, i) {
      var tl = x.t, s = x.s;
      var name = lang === "bn" ? tl.name_bn || tl.name : tl.name;
      var alt = lang === "bn" ? tl.name : tl.name_bn;
      var key = s.id + ":" + tl.id;
      var ico = tl.logo ? '<span class="ico logo"><img src="' + esc(tl.logo) + '" alt="" /></span>' : '<span class="ico">' + svg(tl.icon) + "</span>";
      return '<a class="tile" href="' + esc(base(s) + (tl.path || "")) + '"' + (C.openInNewTab ? ' target="_blank" rel="noopener"' : "") +
        ' style="--c:' + esc(tl.color || "#2f6f9f") + ";animation-delay:" + (i * 0.04).toFixed(2) + 's" data-key="' + esc(key) + '" title="' + esc(name) + " (" + (i + 1) + ')">' + ico +
        '<span class="txt"><strong>' + esc(name) + "</strong>" + (alt ? "<small>" + esc(alt) + "</small>" : "") + "</span>" +
        '<span class="go">' + ARROW + "</span>" +
        '<span class="meta" data-sys="' + esc(s.id) + '" data-off="' + esc(t.offline) + '" data-wait="' + esc(t.updating) + '"><i></i>' + esc(s.code || "") + "</span>" +
        (last === key ? '<span class="last">★ ' + t.last + "</span>" : "") + "</a>";
    }).join("");
    [].forEach.call(document.querySelectorAll(".tile"), function (a) {
      a.addEventListener("click", function () { try { localStorage.setItem("portal-last", a.getAttribute("data-key")); } catch (e) {} });
    });
    paintAll();
    renderRibbon();
  }

  // ---------------------------------------------------- is each system up?
  // The portal server checks every system from this computer (/status.json) — reliable on every browser.
  // If the page is opened some other way, each browser checks the systems itself.
  var state = {};
  function paintAll() {
    [].forEach.call(document.querySelectorAll(".meta"), function (el) {
      var v = state[el.getAttribute("data-sys")];
      el.className = "meta" + (v === "up" ? " ok" : v === "down" ? " down" : v === "building" ? " wait" : "");
      el.title = v === "up" ? T[lang].online : v === "down" ? T[lang].offline : v === "building" ? T[lang].updating : "";
    });
  }
  function direct(s) {
    var done = false;
    var finish = function (v) { if (done) return; done = true; state[s.id] = v; paintAll(); };
    setTimeout(function () { finish("down"); }, 5000);
    fetch(base(s), { mode: "no-cors", cache: "no-store" }).then(function () { finish("up"); }).catch(function () { finish("down"); });
  }
  var timer;
  function checkAll() {
    clearTimeout(timer);
    fetch("status.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok || (r.headers.get("content-type") || "").indexOf("json") < 0) throw 0;
      return r.json();
    }).then(function (j) {
      var any = false;
      C.systems.forEach(function (s) { state[s.id] = (j.systems || {})[s.id] || "down"; if (state[s.id] === "building") any = true; });
      paintAll();
      timer = setTimeout(checkAll, any ? 4000 : 20000);
    }).catch(function () {
      C.systems.forEach(direct);
      timer = setTimeout(checkAll, 30000);
    });
  }

  // -------------------------------------------------- daily activities ribbon
  var pics = [];
  function renderRibbon() {
    var rb = document.getElementById("ribbon"), track = document.getElementById("track");
    document.body.classList.toggle("has-ribbon", pics.length > 0);
    rb.hidden = !pics.length;
    if (!pics.length) return;
    track.innerHTML = '<button class="shot" type="button"></button>';
    var w = track.firstChild.getBoundingClientRect().width || 360;
    var gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 18;
    var setW = pics.length * (w + gap);
    var moving = setW > window.innerWidth * 0.9;
    var copies = moving ? Math.ceil(window.innerWidth / setW) + 1 : 1;
    var one = pics.map(function (p, i) {
      return '<button class="shot" type="button" data-i="' + i + '"><img src="' + esc(p.src) + '" alt="' + esc(p.title) + '" loading="lazy" decoding="async" />' +
        (p.title || p.date ? '<span class="cap"><strong>' + esc(p.title) + "</strong><span>" + esc(fmtDate(p.date)) + "</span></span>" : "") + "</button>";
    }).join("");
    var html = ""; for (var k = 0; k < copies; k++) html += one;
    track.innerHTML = html;
    rb.classList.toggle("static", !moving);
    track.style.setProperty("--shift", setW + "px");
    track.style.setProperty("--dur", pics.length * ((C.activities && C.activities.secondsPerPicture) || 5) + "s");
    [].forEach.call(track.querySelectorAll(".shot"), function (b, n) {
      if (n >= pics.length) { b.tabIndex = -1; b.setAttribute("aria-hidden", "true"); }
      b.addEventListener("click", function () { openLb(Number(b.getAttribute("data-i"))); });
    });
  }
  function loadPics() {
    var folder = (C.activities && C.activities.folder) || "activities";
    var fallback = function () { pics = ((C.activities && C.activities.list) || []).map(function (f) { return { src: folder + "/" + f, title: "", date: null }; }); renderRibbon(); };
    fetch("activities.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (list) { pics = list || []; renderRibbon(); }).catch(fallback);
  }
  var resizeT; window.addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(renderRibbon, 200); });

  // ------------------------------------------------------------- lightbox
  var lb = document.getElementById("lb"), at = 0;
  function showLb() {
    var p = pics[at]; if (!p) return;
    document.getElementById("lb-img").src = p.src;
    document.getElementById("lb-img").alt = p.title || "";
    document.getElementById("lb-title").textContent = p.title || "";
    document.getElementById("lb-date").textContent = fmtDate(p.date);
  }
  function openLb(i) { at = i; showLb(); lb.hidden = false; document.getElementById("ribbon").classList.add("still"); document.getElementById("lb-close").focus(); }
  function closeLb() { lb.hidden = true; document.getElementById("ribbon").classList.remove("still"); }
  function step(d) { at = (at + d + pics.length) % pics.length; showLb(); }
  document.getElementById("lb-close").addEventListener("click", closeLb);
  document.getElementById("lb-prev").addEventListener("click", function () { step(-1); });
  document.getElementById("lb-next").addEventListener("click", function () { step(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });

  // -------------------------------------------------- Bangladesh date & time
  function tick() {
    var now = new Date();
    var time = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dhaka", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(now);
    var date = new Intl.DateTimeFormat(lang === "bn" ? "bn-BD" : "en-GB", { timeZone: "Asia/Dhaka", weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
    document.getElementById("time").textContent = digits(time);
    document.getElementById("date").textContent = date;
  }
  tick(); setInterval(tick, 1000);

  // ------------------------------------------------------- theme & language
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';
  var themeBtn = document.getElementById("theme");
  function paintTheme() { themeBtn.innerHTML = document.documentElement.dataset.theme === "dark" ? SUN : MOON; }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("portal-theme", next); } catch (e) {}
    paintTheme();
  });
  function setLang(l) { lang = l; document.documentElement.lang = l; try { localStorage.setItem("ums-lang", l); } catch (e) {} render(); tick(); }
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  document.getElementById("lang-bn").addEventListener("click", function () { setLang("bn"); });

  // keys: 1 … 9 open a tile; in the picture viewer ← → Esc
  document.addEventListener("keydown", function (e) {
    if (!lb.hidden) {
      if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var n = Number(e.key);
    if (n >= 1 && n <= tiles.length) { var a = document.querySelectorAll(".tile")[n - 1]; if (a) a.click(); }
  });

  paintTheme();
  render();
  checkAll();
  loadPics();
})();
</script>
</body>
</html>
